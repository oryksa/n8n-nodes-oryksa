# Publishes this n8n community node package to npm on every version tag push.
#
# n8n requires community nodes to be published through GitHub Actions with an
# npm provenance statement. Provenance lets anyone verify that the package was
# built by this workflow, from this repository and commit.
#
# One-time setup, done by the owner of the repository:
#   Option A (recommended): on npmjs.com, add this repository and "publish.yml"
#     as a Trusted Publisher of the package. No secret is stored here.
#   Option B: create an npm granular access token and store it as the
#     repository secret NPM_TOKEN.
#
# Release: run `npm run release` locally. It lints, builds, bumps the version,
# tags and pushes; the tag starts this workflow.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
